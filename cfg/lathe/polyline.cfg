[SUBROUTINE]
version = 1.48
icon = lathe-multipass.png
name = _("Lathe Polyline")
type = polyline
help = _("<b>Create a closed or open Polyline in XZ plane</b>")
order = act hx side b_x e_x hz b_z fr_z_on fr_z e_z_on e_z h_opt mode op flank pf_on pass_from skip_short skip_thin pause_on dir multi_x pf_off xw_dir sec_len sectioning h_ret ret_mode ret_dist park_on park_x park_z zc_ovr h_fin n_comp f_off f_off_sep f_off_z f_pass f_dir h_lead li_len li_ang li_rad li_feed lo_len lo_ang lo_rad lo_feed items

[PARAM_ACT]
name = _("Active")
type = bool
icon = enable.png
value = 1

[PARAM_H_OPT]
name = _("Roughing")
type = sub-header

[PARAM_MODE]
name = _("Strategy")
header = h_opt
type = combo
options = _("Profile Shift (All LCNC versions)=0:G71 Contour Roughing (LCNC 2.9+)=71:G72 Face Roughing (LCNC 2.9+)=72")
value = 0
tool_tip = _("Select roughing strategy. G71/G72 require LinuxCNC 2.9+ or a configured remap.")

[PARAM_OP]
name = _("Operation")
header = h_opt
type = combo
options = _("Roughing + Finishing=0:Roughing only=1:Finishing only=2")
icon = operation.png
tool_tip = _("Roughing only leaves the finish offset on the part. Finishing only traces the connected contour passes. Profile Shift strategy only.")
value = 0

[PARAM_FLANK]
name = _("Respect tool back angle")
header = h_opt
type = bool
icon = lathe-tool.png
value = 1
tool_tip = _("Stop roughing where the tool's back flank would foul a wall it has already driven past, instead of dropping straight down behind it as if the insert were a point. The reachable floor behind a raised feature becomes a ramp leaving that feature's corner at the back angle from the tool table. Finishing passes are unaffected - they still trace the true profile. Needs a BACK angle on the loaded tool; with none, this does nothing. The flank is treated as unbounded: the ramp runs on until it meets the drawn profile again and corners there, rather than releasing part way. The Tool Change flank length draws the grey tool silhouette and does not shorten this shadow.")

[PARAM_PF_ON]
name = _("Pre-finish pass")
header = h_opt
type = bool
tool_tip = _("Whether the pre-finish contour pass runs at all, independent of the Pre-finish offset value below - turn off to skip it entirely without losing your configured offset.")
value = 1

[PARAM_PASS_FROM]
name = _("Space passes from")
header = h_opt
type = combo
options = _("Stock=0:Final contour=1")
icon = direction.png
value = 0
tool_tip = _("Where the roughing levels are anchored. Stock spaces them evenly between the workpiece and the roughing floor, so every step is the same and a little under the depth of cut. Final contour takes full depth-of-cut steps measured from the finished shape outward, so the last level lands exactly on the floor and the odd remainder falls on the first pass at the stock - a full-length cut through oversize material, instead of a level sitting just clear of the finished surface and grazing it for a sliver.")

[PARAM_SKIP_SHORT]
name = _("Skip short roughing passes")
header = h_opt
type = bool
icon = lathe-tool.png
value = 0
tool_tip = _("Skip a roughing level whose cuttable length is under 2.5 times the tool nose diameter. Such a level sits almost entirely inside the pre-finish allowance, so the contour pass that follows removes the same metal in one go - cutting it first costs a full approach and retract to take off almost nothing. Off by default - it is a saving, not a correctness fix, and a skipped level is metal the contour pass then has to take in one go.")

[PARAM_SKIP_THIN]
name = _("Skip thin roughing passes")
header = h_opt
type = float
minimum_value = 0.0
icon = offset.png
tool_tip = _("Skip a roughing level that would take off less than this much radius - it removes almost nothing, and a pass barely touching the surface is where chatter starts. 0 = off, take every level. Measured against the last level actually cut, so a level after a skipped one is judged on the whole gap it now takes. The level on the roughing floor itself is never skipped - it is the surface roughing has to leave. Half the roughing depth of cut is a sensible starting value.")
value = 0.0
metric_value = 0.0

[PARAM_PAUSE_ON]
name = _("Pause after roughing")
header = h_opt
type = bool
tool_tip = _("Pause the program (M0) once roughing - and the pre-finish pass, if any - completes, before the finish pass runs. Gives you a chance to measure the workpiece and dial in tool offset compensation before the final cut. No effect with Operation set to Roughing only (nothing follows) or Finishing only (nothing precedes it).")
value = 0

[PARAM_DIR]
name = _("Direction")
header = h_opt
type = combo
options = _("Front to back=0:Back to front=1:Both directions=2")
icon = direction.png
tool_tip = _("Roughing pass direction. Both directions alternates per pass. Profile Shift strategy only.")
value = 0

[PARAM_MULTI_X]
name = _("Re-entrant profile (always on)")
header = h_opt
type = combo
options = _("Off - stop at first crossing=0:On - rough all disjoint intervals=1")
icon = direction.png
tool_tip = _("Kept only so older saved projects still load their stored value - disjoint-interval roughing is now applied automatically to every polyline, since even a simple taper that starts near the stock diameter needs it to be roughed correctly, not just re-entrant/necked shapes. This control no longer changes generated G-code.")
value = 1

[PARAM_PF_OFF]
name = _("Pre-finish offset (per side)")
header = h_opt
type = float
minimum_value = 0.0
icon = offset.png
tool_tip = _("Pre-finish pass depth of cut: level roughing stops this far above the semi-final shape and one contour pass removes it. 0 = no pre-finish pass.")
value = 0.01
metric_value = 0.3

[PARAM_XW_DIR]
name = _("X wall cut")
header = h_opt
type = combo
options = _("With pass=0:Outside to inside=2")
icon = direction.png
tool_tip = _("How contour passes cut perpendicular X walls: following the pass flow, or detached from the outside down to the corner to reduce cutting forces.")
value = 0

[PARAM_SEC_LEN]
name = _("Z section length")
header = h_opt
type = float
minimum_value = 0.0
icon = z.png
tool_tip = _("With Sectioning off: rough in constant-length Z windows, front to back, all diameters cut within one window before advancing (0 = whole length at once). With Sectioning on: 0 = Natural (the profile's own wall boundaries only); >0 = Artificial (each natural section longer than this length is further sliced into that many equal pieces, still weakest-first).")
value = 0.0
metric_value = 0.0

[PARAM_SECTIONING]
name = _("Sectioning")
header = h_opt
type = bool
icon = z.png
tool_tip = _("Auto-detect the profile's own wall boundaries and rough each resulting section fully, smallest-diameter (weakest, most chatter-prone) section first, so the rest of the stock stays near full diameter and rigid while the thin part is cut. Z section length above then selects Natural (0) or Artificial (>0) sectioning - see its tool tip.")
value = 0

[PARAM_H_RET]
name = _("Retract / start point")
type = sub-header

[PARAM_RET_MODE]
name = _("Retract")
header = h_ret
type = combo
options = _("Full - above stock=0:Minimal=1")
icon = lead-out.png
tool_tip = _("Between roughing passes: full retract above the stock, or minimal retract just above the previous pass level.")
value = 0

[PARAM_RET_DIST]
name = _("Retract distance")
header = h_ret
type = float
minimum_value = 0.0
icon = offset.png
tool_tip = _("Clearance above the previous pass level for the minimal retract return move.")
value = 0.04
metric_value = 1.0

[PARAM_PARK_ON]
name = _("Return to start point")
header = h_ret
type = combo
options = _("Off=0:On=1")
icon = enable.png
tool_tip = _("Move to the start point before machining and return to it when the operation ends.")
value = 0

[PARAM_PARK_X]
name = _("Start point X (Diameter)")
header = h_ret
type = float
icon = x.png
tool_tip = _("Park position the operation starts from and returns to.")
value = 4.0
metric_value = 100.0

[PARAM_PARK_Z]
name = _("Start point Z")
header = h_ret
type = float
icon = z.png
tool_tip = _("Park position the operation starts from and returns to.")
value = 4.0
metric_value = 100.0

[PARAM_ZC_OVR]
name = _("Z lead-in distance")
header = h_ret
type = float
minimum_value = 0.0
icon = z.png
tool_tip = _("Distance the tool rapids to, short of the cut, before every plunge - this polyline's own value, used directly (not layered on the Tool Change retract distance/tool radius, which is handled separately by the remapped M6). 0 = plunge straight in with no standoff.")
value = 0.0
metric_value = 0.0

[PARAM_H_FIN]
name = _("Finishing")
type = sub-header

[PARAM_N_COMP]
name = _("Tool nose comp")
header = h_fin
type = combo
options = _("Native LinuxCNC=1:In CAM=2:Off=0")
icon = tool.png
tool_tip = _("Native LinuxCNC lets the interpreter compensate with G41.1/G42.1 - the default, and the only mode with no geometry of ours in the path. In CAM offsets the toolpath here instead and runs the machine uncompensated, which sidesteps native comp's entry rules and its refusal of concave corners smaller than the nose, at the cost of owning the geometry. Off applies no nose compensation at all.")
value = 1

[PARAM_F_OFF]
name = _("Offset (per side)")
header = h_fin
type = float
minimum_value = 0.0
icon = offset.png
tool_tip = _("Material left on the profile by roughing, removed by the finishing passes. 0 = no finishing.")
value = 0.02
metric_value = 0.5

[PARAM_F_OFF_SEP]
name = _("Separate Z offset")
header = h_fin
type = bool
icon = offset.png
tool_tip = _("Leave a different amount on the WALLS than on the diameters. Off - one allowance, held perpendicular to the whole profile, which is what this operation has always done. On - 'Offset (per side)' becomes the RADIAL allowance, held on the diameters, and 'Z offset (per side)' is the AXIAL one, held on the faces and walls; a sloped surface gets a blend of the two, by its own angle. The pre-finish pass honours both. ROUGHING DOES NOT YET: its levels stop on a single perpendicular allowance worked out at runtime, so where the axial value is LARGER than 'Offset (per side)' plus 'Pre-finish offset' roughing cuts closer to a wall than you asked - measured 0.762 from a wall set to 2.000. The pre-finish and finishing passes still leave the part correct; what is wrong is how much roughing leaves them to take. INTERMEDIATE finishing passes - only when Passes is more than 1 AND Tool nose comp is Native LinuxCNC - use the radial value alone, because the interpreter's D word is a single number. In CAM has no such limit.")
value = 0

[PARAM_F_OFF_Z]
name = _("Z offset (per side)")
header = h_fin
type = float
minimum_value = 0.0
icon = offset.png
tool_tip = _("Material left on the WALLS and faces - the axial direction - when 'Separate Z offset' is on. The diameters keep 'Offset (per side)'. A surface that is neither flat nor vertical gets a blend of the two by its own normal, so a 45 degree chamfer is left the mean of them. Ignored entirely when 'Separate Z offset' is off.")
value = 0.02
metric_value = 0.5

[PARAM_F_PASS]
name = _("Passes")
header = h_fin
type = int
minimum_value = 0
icon = repeat.png
tool_tip = _("Number of finishing passes stepping the offset down to the final profile.")
value = 1

[PARAM_F_DIR]
name = _("Direction")
header = h_fin
type = combo
options = _("Front to back=0:Back to front=1:Both directions=2")
icon = direction.png
tool_tip = _("Finishing pass direction. Both directions alternates per pass.")
value = 0

[PARAM_H_LEAD]
name = _("Lead in / out")
type = sub-header

[PARAM_LI_LEN]
name = _("Lead-in length")
header = h_lead
type = float
minimum_value = 0.0
icon = lead-in.png
tool_tip = _("Angled feed move into the contour start of every pass. 0 = plunge approach.")
value = 0.0
metric_value = 0.0

[PARAM_LI_ANG]
name = _("Lead-in angle")
header = h_lead
type = float
minimum_value = 0.0
maximum_value = 90.0
icon = angle.png
tool_tip = _("Degrees from Z: 0 = along Z, 90 = radial.")
value = 45.0

[PARAM_LI_RAD]
name = _("Lead-in radius")
header = h_lead
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Tangent quarter-arc into the contour entry. 0 = none. Combines with the straight lead-in length.")
value = 0.0
metric_value = 0.0

[PARAM_LI_FEED]
name = _("Lead-in feed")
header = h_lead
type = float
minimum_value = 0.0
icon = feed.png
tool_tip = _("Feed rate for the lead-in move. 0 = pass feed.")
value = 0.0
metric_value = 0.0

[PARAM_LO_LEN]
name = _("Lead-out length")
header = h_lead
type = float
minimum_value = 0.0
icon = lead-out.png
tool_tip = _("Angled feed move away from the end of every pass. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LO_ANG]
name = _("Lead-out angle")
header = h_lead
type = float
minimum_value = 0.0
maximum_value = 90.0
icon = angle.png
tool_tip = _("Degrees from the surface at that point: 0 = continues straight along it, 90 = breaks fully perpendicular to it.")
value = 45.0

[PARAM_LO_RAD]
name = _("Lead-out radius")
header = h_lead
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Rounded escape at the end of every roughing pass. Kept tangent to the pre-finish/finish contour automatically - a larger value ends that pass slightly earlier so the arc stays tangent instead of cutting past it. Limited by the lead-out length. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LO_FEED]
name = _("Lead-out feed")
header = h_lead
type = float
minimum_value = 0.0
icon = feed.png
tool_tip = _("Feed rate for the lead-out move. 0 = pass feed.")
value = 0.0
metric_value = 0.0

[PARAM_HX]
name = _("X axis (Diameter)")
type = sub-header

[PARAM_SIDE]
name = _("Side")
header = hx
type = combo
icon = od-advanced.png
options = _("Outside (OD)=0:Inside (ID)=1")
value = 0
tool_tip = _("Which side of the profile the material is on. Outside turns down from the stock diameter; Inside bores outward from the existing hole, so Start Diameter is that hole and Final Diameter the largest the profile reaches.")

[PARAM_B_X]
name = _("Start Diameter")
header = hx
type = float
icon = x.png
value = 1.0
metric_value = 25.0

[PARAM_E_X]
name = _("Final Diameter")
header = hx
type = float
icon = x-end.png
value = 0.8
metric_value = 20.0

[PARAM_HZ]
name = _("Z axis")
type = sub-header

[PARAM_B_Z]
name = _("Start Z")
header = hz
type = float
icon = z.png
value = 0.0
metric_value = 0.0

[PARAM_FR_Z_ON]
name = _("Limit Front Z")
header = hz
type = bool
icon = z.png
tool_tip = _("Start the operation at 'Front Z' instead of at the front of the drawn profile, leaving the material in front of it for another setup or another tool. Off by default, and off means the profile is used exactly as drawn. NOT the same as Start Z: that is a datum - it resolves the first item's relative coordinates and is the reference roughing starts from - and it never removes profile. A switch rather than a special number because a profile may begin at a positive Z.")
value = 0

[PARAM_FR_Z]
name = _("Front Z")
header = hz
type = float
icon = z.png
tool_tip = _("Machine only from this Z backwards. Everything in front of it is left. Active only when it falls INSIDE the profile - at or beyond either end it does nothing. The trim is interpolated, so the profile begins exactly here and not at the first point behind it. Use with 'End Z' to machine a span out of the middle of a part.")
value = 0.0
metric_value = 0.0

[PARAM_E_Z_ON]
name = _("Limit End Z")
header = hz
type = bool
icon = z.png
tool_tip = _("Stop the operation at 'End Z' instead of running to the end of the drawn profile. Off by default, and off means the profile is used exactly as drawn - there is no value of End Z that can change anything while this is off. A switch rather than a special number because a profile may start at a POSITIVE Z: on such a part 0.0 falls inside the profile, and treating it as 'no limit' trimmed nearly the whole part away.")
value = 0

[PARAM_E_Z]
name = _("End Z")
header = hz
type = float
icon = z.png
tool_tip = _("Stop the whole operation at this Z, leaving the rest of the drawn profile for another setup or another tool. The profile is trimmed here before anything else is worked out, so roughing, the pre-finish pass, the finishing passes, the section windows and the reachable-contour warning all agree about where the part ends. ACTIVE ONLY WHEN IT FALLS INSIDE THE PROFILE: at or beyond either end it does nothing, so the default 0.0 leaves a profile running back from the face untouched. The trim is interpolated, so the profile ends exactly here and not at the last point before it.")
value = 0.0
metric_value = 0.0

[PARAM_ITEMS]
name = _("Items")
type = items
icon = items.png
tool_tip = _("Add profile items here")

[VALIDATION]
content =
	if WARN_UNREACHABLE :
		_spans = lathe_sections.unreachable_spans(self, TOOL_TABLE.get_back_angle(), 0.01, TOOL_TABLE.get_flank_len(), TOOL_TABLE.get_back_clear())
		if _spans :
			_z0 = min(a for a, _b, _g in _spans)
			_z1 = max(b for _a, b, _g in _spans)
			_gap = max(g for _a, _b, g in _spans)
			self.msg_inv(_('The tool back angle cannot reach part of this profile: Z%(z0).2f to Z%(z1).2f, up to %(gap).2f mm of radius. The finishing passes follow the reachable contour there, so the part will not come out to the drawn shape. Use a tool with more back clearance, or turn this warning off in Utilities.') % {'z0': _z0, 'z1': _z1, 'gap': _gap}, 2)
	if #param_fr_z_on and #param_e_z_on :
		if #param_fr_z <= #param_e_z :
			VALIDATED = False
			self.msg_inv(_('Front Z must be in FRONT of End Z - the two limits keep the span between them, so Front Z %(a).3f at or behind End Z %(b).3f leaves nothing to machine.') % {'a': #param_fr_z, 'b': #param_e_z}, 1)
	if #param_n_comp == 2 :
		_nr, _or = tip_comp_inputs()
		if _nr <= 0.0 :
			VALIDATED = False
			self.msg_inv(_('In CAM nose compensation needs a tool nose radius, and neither the tool table nose diameter (D) nor the Tool Change override gives one.'), 1)
		elif not 0 < _or < 10 :
			VALIDATED = False
			self.msg_inv(_('In CAM nose compensation needs a tool orientation of 1-9, from the tool table (Q) or the Tool Change override.'), 1)
		elif #param_mode != 0 :
			VALIDATED = False
			self.msg_inv(_('In CAM nose compensation only applies to Profile Shift Roughing - the G7x cycles compensate in the interpreter. Use Native LinuxCNC.'), 1)

[DEFINITIONS]
content =
	O#ID sub
		o<trace_lathe> CALL [#<_mill_data_start>] [0] [1]
	O#ID endsub

[BEFORE]
content =
	(begin #sub_name)
	
	o<#self_id_active> if [#param_act AND [#<in_polyline> EQ 0]]
		(init and set origin: Z is mill-X, X is mill-Y in radius units)
		o<poly_add_item> CALL [-1] [#param_b_z] [#param_b_x / #<_diameter_mode>] [0] [0] [0] [0] [0] [0] [0] [0]
		
		#<in_polyline> = 1
		(begin #sub_name items)

[AFTER]
content =
		(end #sub_name items)
		#<in_polyline> = 0
		
		o<#self_id_end> if [#5000 GT 0]
			(Create and mill profile)
			o<poly_create> CALL
			(build forward and reversed record arrays for direction control)
			o<poly_copy_lathe> CALL [#<_mill_data_start>]
			#<_mill_data_rev> = [#<_mill_data_start> + #[#<_mill_data_start>] * 8 + 1]
			o<poly_reverse_lathe> CALL [#<_mill_data_start>] [#<_mill_data_rev>]

			o<#self_id_mode> if [#param_mode EQ 0]
				(Profile Shift Roughing - short param slots keep the call line under the interpreter limit.)
				(#3141-#3159, not #141-#159: the record array built above by poly_copy_lathe/)
				(poly_reverse_lathe starts at _mill_data_start=70 and runs 16*rec_count slots)
				(past it, forward plus reversed - for any profile with roughly 9+ points that)
				(reaches past 140 and silently corrupts these slots along with the record data)
				(they'd overlap. #3141+ is far beyond where a real polyline's record array)
				(could ever reach.)
				#3141 = [#param_b_x / #<_diameter_mode>]
				#3142 = [#param_e_x / #<_diameter_mode>]
				#3143 = #param_dir
				#3144 = #param_f_off
				#3145 = #param_f_pass
				#3146 = #param_f_dir
				#3147 = #param_op
				#3148 = #param_li_len
				#3149 = #param_li_ang
				#3150 = #param_li_feed
				#3151 = #param_lo_len
				#3152 = #param_lo_ang
				#3153 = #param_lo_feed
				#3154 = #param_li_rad
				#3155 = #param_lo_rad
				(pre-finish pass toggle is folded into the offset itself here -)
				(zeroing it reuses the exact same "0 = no pre-finish pass" gate)
				(poly_lathe_mill already has, without needing a new argument)
				#3156 = [#param_pf_off * #param_pf_on]
				#3157 = #param_xw_dir
				#3158 = #param_sec_len
				#3159 = #param_n_comp
				(retract and park settings travel as globals - the call is at the 30 argument limit)
				(which side the material is on: the roughing levels start)
				(from the stock OD going in, or the existing bore going out)
				#<_pl_side>  = #param_side
				#<_pl_x_sgn> = 1
				o<#self_id_side> if [#param_side EQ 1]
					#<_pl_x_sgn> = -1
				o<#self_id_side> endif
				#<_pl_ret_mode> = #param_ret_mode
				#<_pl_ret_dist> = #param_ret_dist
				#<_pl_park_on>  = #param_park_on
				#<_pl_park_x>   = #param_park_x
				#<_pl_park_z>   = #param_park_z
				#<_pl_zc_ovr>   = #param_zc_ovr
				(disjoint-interval roughing is always active - #param_multi_x is)
				(kept only so older saved projects still load their stored value,)
				(it no longer gates anything; a plain taper that starts near the)
				(stock diameter needs the same disjoint-interval handling a)
				(re-entrant/necked profile does, so there is no safe "off" case)
				#<_pl_multi_cross> = 1
				#<_pl_pause_on> = #param_pause_on
				(minimum worthwhile roughing pass: 2.5 x the loaded tool's nose radius,)
				(read at runtime so the limit follows whatever tool is in the turret)
				(minimum worthwhile roughing pass: 2.5 x the loaded tool's nose DIAMETER.)
				(Resolved HERE, not from #5410 at runtime: the tool table rs274 loads for)
				(this config is in inches while the program is metric, so a raw #5410 read)
				(came out 0.0625 and the limit computed to 0.156 mm instead of 2.0, and)
				(the gate could never fire. tip_comp_inputs applies TBL_SCALE and returns)
				(the nose radius in program units - the same source the nose compensation)
				(and the reachable contour already use.)
				#<_pl_pass_from> = #param_pass_from
			(a level thinner than this takes off almost nothing and chatters)
			#<_pl_skip_thin> = #param_skip_thin
			(the definition's own Begin Z - the reference a pass may not start in)
			(front of. Not in the lathe record array: its record 1 is the first)
			(ITEM's endpoint, which on this project is Z+1.0, not the origin)
			(where roughing may BEGIN. Normally the polyline's own Start Z, but a)
			(front limit has to move it: trimming the profile alone leaves the)
			(levels starting at Start Z and sweeping BACK through the material)
			(the limit was meant to leave - on testing_15_2 with Front Z -20 the)
			(program still began at Z+0.707 and cut the whole front of the part.)
			#<_pl_begin_z> = <eval>min(#param_b_z, #param_fr_z) if #param_fr_z_on else #param_b_z</eval>
				#<_pl_min_pass> = <eval> (5.0 * tip_comp_inputs()[0]) if self.get_param('param_skip_short').get_ngc_value() == '1' else 0.0 </eval>
				#<_pl_sectioning> = #param_sectioning
				(Sectioning's wall-detection/ranking is computed in Python at)
				(generation time via lathe_sections.py, not at G-code runtime -)
				(this fills #3401+ / _pl_sect_count / _pl_sect_top_dia when)
				(Sectioning is on and the profile is plain Line-To segments;)
				(otherwise it emits nothing and poly_lathe_mill's own)
				(_pl_sect_count GT 0 gate falls back to plain windowing)
				(a profile with no length along Z, or one resolving to a single)
				(point, generates a valid file containing no useful motion - the)
				(build appears to succeed and the backplot stays empty. Say so)
				(instead, in the program itself and in a dialog. The dialog is)
				(guarded because exec_callback discards the whole block's output)
				(on any exception, which would lose the comment too)
				<exec>
				_p = lathe_sections.profile_problem(self)
				if _p :
				    print('(WARNING - Lathe Polyline: %s)' % _p)
				    try :
				        mess_dlg(_('Lathe Polyline') + ': ' + _p)
				    except Exception :
