[SUBROUTINE]
version = 1.23
icon = lathe-facing.png
name = _("Facing")
type = facing
help = _("<b>Face end and optionnaly set this face to 0.0</b>&#10; Verify cutter orientation")
order = act hx dir b_x_ref b_x e_x_ref e_x hz fz_ref fz zd sl h_pass np h_lead li_len li_ang li_rad lo_len lo_ang lo_rad hf fin n_comp ht t

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_HX]
name = _("X axis")
type = sub-header

[PARAM_B_X]
name = _("Begin diameter")
type = float
icon = x.png
value = 1.0
metric_value = 25.0
minimum_value = 0.0
not_allowed = 0
header = hx

[PARAM_E_X]
name = _("End diameter")
type = float
icon = x-end.png
value = 0.0
metric_value = 0.0
header = hx

[PARAM_B_X_REF]
name = _("Begin diameter from")
header = hx
type = combo
options = _("Value=0:Stock OD=1:Stock ID=2")
icon = circle-rad-dia.png
tool_tip = _("What Begin diameter is measured from. Value: the diameter itself. Stock OD or Stock ID: an offset from the Workpiece diameter, so the operation follows the stock when it changes - use a negative offset to come in from the OD.")
value = 0

[PARAM_E_X_REF]
name = _("End diameter from")
header = hx
type = combo
options = _("Value=0:Stock OD=1:Stock ID=2")
icon = circle-rad-dia.png
tool_tip = _("What End diameter is measured from. Value: the diameter itself. Stock OD or Stock ID: an offset from the Workpiece diameter. Stock ID with offset 0 ends the face on the bore; on solid stock the ID is 0, which is the centre.")
value = 0

[PARAM_DIR]
name = _("Direction")
header = hx
type = combo
options = _("Outside to inside=0:Inside to outside=1")
icon = lathe-dir.png
tool_tip = _("Which way each pass travels. Outside to inside cuts from Begin diameter toward End diameter; Inside to outside runs them the other way round, without needing the two diameters swapped by hand.")
value = 0

[PARAM_HZ]
name = _("Z axis")
type = sub-header

[PARAM_FZ_REF]
name = _("Face Z from")
header = hz
type = combo
options = _("Stock face=0:Coordinate system=1")
icon = z.png
value = 0
value_changed =
	parent.get_param('param_fz').attr['name'] = _("'Face Z'") if new_val == '1' else _("'Face Z offset'")
tool_tip = _("Where the finished face sits. Stock face measures from the Workpiece feature's Begin position, so the operation follows the stock; Coordinate system takes the value below as an absolute Z in the active work offset.")

[PARAM_FZ]
name = _("Face Z offset")
header = hz
type = float
icon = z.png
value = 0.0
metric_value = 0.0
tool_tip = _("Offset from the stock face, or the absolute Z of the finished face, depending on the setting above. 0 with Stock face gives the old behaviour - the face lands exactly on the Workpiece Z.")

[PARAM_ZD]
name = _("Z depth of cut")
header = hz
type = float
icon = z-end.png
value = 0.03
metric_value = 0.75
not_allowed = 0
tool_tip = _("The Workpiece's Z position is the final layer (Z depth of cut = 0). Positive values start the cut further out, as the workpiece length increases from that layer; negative values start closer in, as it decreases.")

[PARAM_SL]
name = _("Axial stock to leave")
header = hz
type = float
minimum_value = 0.0
icon = z.png
tool_tip = _("Material this operation leaves standing on the finished face for a later one to take off. Every pass stops that far short of the face, roughing and finishing alike, so 0.5 leaves the face 0.5 above where it is defined. The roughing-to-finishing allowance is separate - that is the Tool Change's finish cut depth.")
value = 0.0
metric_value = 0.0

[PARAM_H_PASS]
name = _("Passes")
type = sub-header

[PARAM_NP]
name = _("Number of passes")
header = h_pass
type = int
minimum_value = 0
icon = repeat.png
tool_tip = _("Roughing pass count - always exactly this many equal-depth passes. 0 = no roughing, finishing pass(es) only (e.g. facing from bar stock after parting).")
value = 1

[PARAM_H_LEAD]
name = _("Lead in / out")
type = sub-header

[PARAM_LI_LEN]
name = _("Lead-in length")
header = h_lead
type = float
minimum_value = 0.0
icon = lead-in.png
tool_tip = _("Angled feed move into the start of every facing pass. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LI_ANG]
name = _("Lead-in angle")
header = h_lead
type = float
minimum_value = 0.0
maximum_value = 90.0
icon = angle.png
tool_tip = _("Degrees from the face: 0 = along X, 90 = straight in Z.")
value = 45.0

[PARAM_LI_RAD]
name = _("Lead-in radius")
header = h_lead
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Tangent quarter-arc into the pass start. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LO_LEN]
name = _("Lead-out length")
header = h_lead
type = float
minimum_value = 0.0
icon = lead-out.png
tool_tip = _("Angled feed move away from the end of every facing pass. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LO_ANG]
name = _("Lead-out angle")
header = h_lead
type = float
minimum_value = 0.0
maximum_value = 90.0
icon = angle.png
tool_tip = _("Degrees from the face: 0 = along X, 90 = straight off in Z.")
value = 45.0

[PARAM_LO_RAD]
name = _("Lead-out radius")
header = h_lead
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Quarter-arc escape pulling off the face. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_HF]
name = _("Finishing")
type = sub-header

[PARAM_FIN]
name = _("Number of passes")
icon = finish.png
type = int
value = 1
minimum_value = 0
tool_tip = _("Dedicated finish pass(es) at the exact final Z, at finish feed. Or spring passes.")
header = hf

[PARAM_N_COMP]
name = _("Tool nose comp")
header = hf
type = combo
options = _("Native LinuxCNC=1:In CAM=2:Off=0")
icon = corner-radius.png
tool_tip = _("Native LinuxCNC lets the interpreter compensate with G41.1/G42.1 - the default, and the only mode with no geometry of ours in the path. In CAM offsets the toolpath here instead and runs the machine uncompensated, which sidesteps native comp's refusal of concave corners smaller than the nose, at the cost of owning the geometry - on this operation it still replaces the lead-in/out arcs with a straight run-in beyond the OD. Off applies no nose compensation at all.")
value = 1

[PARAM_HT]
name = _("Touch off")
type = sub-header

[PARAM_T]
name = _("Set Z to 0")
icon = 00.png
type = bool
header = ht
value = 1
tool_tip = _("Set finished face to Z0")

[INIT]
content =
	a = parent.get_param('param_fz_ref').get_attr('value')
	parent.get_param('param_fz').attr['name'] = _("'Face Z'") if a == '1' else _("'Face Z offset'")

[VALIDATION]
content =
	if #param_n_comp == 2 :
		VALIDATED = False
		self.msg_inv(_('In CAM nose compensation is not proven on facing yet. It produces the same cutting coordinates as Native LinuxCNC, but its approach moves place the tool past the finished face before the cut and the tangency proof reports a gouge there that Native does not. Use Native LinuxCNC.'), 1)
	if #param_act == 1 :
		if self.check_hash('#param_b_x', 1) < self.check_hash('#param_e_x', 0) :
			self.msg_inv(_('Begin X must be greater than End X'), 1)
			VALIDATED = False

		if TOOL_TABLE.get_tool_orient() not in [0, 2, 3, 7, 9] :
			self.msg_inv(_('Cutter orientation should be 2, 3, 7, 9 or 0'), 2)

[CALL]
content =
	(begin #sub_name)
	(author : Fernand Veilleux)

	o<#self_id_act> if [#param_act]

		(a diameter can be given outright or as an offset from the stock, so an)
		(operation stays right when the Workpiece changes. _wp_dia_od / _wp_dia_id)
		(are set by the Workpiece feature and are already diameters)
		o<#self_id_bxr> if [#param_b_x_ref EQ 1]
			#<f_bx> = [#<_wp_dia_od> + #param_b_x]
		o<#self_id_bxr> elseif [#param_b_x_ref EQ 2]
			#<f_bx> = [#<_wp_dia_id> + #param_b_x]
		o<#self_id_bxr> else
			#<f_bx> = #param_b_x
		o<#self_id_bxr> endif

		o<#self_id_exr> if [#param_e_x_ref EQ 1]
			#<f_ex> = [#<_wp_dia_od> + #param_e_x]
		o<#self_id_exr> elseif [#param_e_x_ref EQ 2]
			#<f_ex> = [#<_wp_dia_id> + #param_e_x]
		o<#self_id_exr> else
			#<f_ex> = #param_e_x
		o<#self_id_exr> endif

		(Direction only decides which end each pass starts from, so it is a swap)
		(of the two resolved diameters rather than anything the subroutine needs)
		o<#self_id_dir> if [#param_dir EQ 1]
			#<f_tmp> = #<f_bx>
			#<f_bx> = #<f_ex>
			#<f_ex> = #<f_tmp>
		o<#self_id_dir> endif

		(the finished face: an offset from the stock face, so the operation)
		(follows the Workpiece, or an absolute Z in the active work offset)
		o<#self_id_fzr> if [#param_fz_ref EQ 1]
			#<f_fz> = #param_fz
		o<#self_id_fzr> else
			#<f_fz> = [#<_wp_z> + #param_fz]
		o<#self_id_fzr> endif

		(Z depth of cut sets the start position from that face)
		o<facing> CALL [#<f_bx>] [#<f_ex>] [#<f_fz> + #param_zd] [#<f_fz>] [#param_fin] [#param_t] [#param_li_len] [#param_li_ang] [#param_li_rad] [#param_lo_len] [#param_lo_ang] [#param_lo_rad] [#param_np] [#param_n_comp] [#param_sl]

	o<#self_id_act> endif

	(end #sub_name)
