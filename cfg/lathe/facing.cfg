[SUBROUTINE]
version = 1.18
icon = lathe-facing.png
name = _("Facing")
type = facing
help = _("<b>Face end and optionnaly set this face to 0.0</b>&#10; Verify cutter orientation")
order = act hx b_x e_x hz zd h_pass np h_lead li_len li_ang li_rad lo_len lo_ang lo_rad hf fin n_comp ht t

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_HX]
name = _("X axis")
type = sub-header

[PARAM_B_X]
name = _("Begin diameter")
type = float
icon = x.png
value = 1.0
metric_value = 25.0
minimum_value = 0.0
not_allowed = 0
header = hx

[PARAM_E_X]
name = _("End diameter")
type = float
icon = x-end.png
value = 0.0
metric_value = 0.0
header = hx

[PARAM_HZ]
name = _("Z axis")
type = sub-header

[PARAM_ZD]
name = _("Z depth of cut")
header = hz
type = float
icon = z-end.png
value = 0.03
metric_value = 0.75
not_allowed = 0
tool_tip = _("The Workpiece's Z position is the final layer (Z depth of cut = 0). Positive values start the cut further out, as the workpiece length increases from that layer; negative values start closer in, as it decreases.")

[PARAM_H_PASS]
name = _("Passes")
type = sub-header

[PARAM_NP]
name = _("Number of passes")
header = h_pass
type = int
minimum_value = 0
icon = repeat.png
tool_tip = _("Roughing pass count - always exactly this many equal-depth passes. 0 = no roughing, finishing pass(es) only (e.g. facing from bar stock after parting).")
value = 1

[PARAM_H_LEAD]
name = _("Lead in / out")
type = sub-header

[PARAM_LI_LEN]
name = _("Lead-in length")
header = h_lead
type = float
minimum_value = 0.0
icon = lead-in.png
tool_tip = _("Angled feed move into the start of every facing pass. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LI_ANG]
name = _("Lead-in angle")
header = h_lead
type = float
minimum_value = 0.0
maximum_value = 90.0
icon = angle.png
tool_tip = _("Degrees from the face: 0 = along X, 90 = straight in Z.")
value = 45.0

[PARAM_LI_RAD]
name = _("Lead-in radius")
header = h_lead
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Tangent quarter-arc into the pass start. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LO_LEN]
name = _("Lead-out length")
header = h_lead
type = float
minimum_value = 0.0
icon = lead-out.png
tool_tip = _("Angled feed move away from the end of every facing pass. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_LO_ANG]
name = _("Lead-out angle")
header = h_lead
type = float
minimum_value = 0.0
maximum_value = 90.0
icon = angle.png
tool_tip = _("Degrees from the face: 0 = along X, 90 = straight off in Z.")
value = 45.0

[PARAM_LO_RAD]
name = _("Lead-out radius")
header = h_lead
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Quarter-arc escape pulling off the face. 0 = none.")
value = 0.0
metric_value = 0.0

[PARAM_HF]
name = _("Finishing")
type = sub-header

[PARAM_FIN]
name = _("Number of passes")
icon = finish.png
type = int
value = 1
minimum_value = 0
tool_tip = _("Dedicated finish pass(es) at the exact final Z, at finish feed. Or spring passes.")
header = hf

[PARAM_N_COMP]
name = _("Tool nose comp")
header = hf
type = combo
options = _("Off=0:On=1")
icon = corner-radius.png
tool_tip = _("Compensate the finish face for the tool nose radius so the cutting edge, not the control point, lands at the target Z. Uses the loaded tool's nose diameter (tool table) and orientation, or the machine default. When on, the lead-in/out arcs are skipped (comp needs a straight run-in). 0 = control-point path.")
value = 0

[PARAM_HT]
name = _("Touch off")
type = sub-header

[PARAM_T]
name = _("Set Z to 0")
icon = 00.png
type = bool
header = ht
value = 1
tool_tip = _("Set finished face to Z0")

[VALIDATION]
content =
	if #param_act == 1 :
		if self.check_hash('#param_b_x', 1) < self.check_hash('#param_e_x', 0) :
			self.msg_inv(_('Begin X must be greater than End X'), 1)
			VALIDATED = False

		if TOOL_TABLE.get_tool_orient() not in [0, 2, 3, 7, 9] :
			self.msg_inv(_('Cutter orientation should be 2, 3, 7, 9 or 0'), 2)

[CALL]
content =
	(begin #sub_name)
	(author : Fernand Veilleux)

	o<#self_id_act> if [#param_act]

		(Workpiece Z is the final layer; Z depth of cut sets the start position from it)
		o<facing> CALL [#param_b_x] [#param_e_x] [#<_wp_z> + #param_zd] [#<_wp_z>] [#param_fin] [#param_t] [#param_li_len] [#param_li_ang] [#param_li_rad] [#param_lo_len] [#param_lo_ang] [#param_lo_rad] [#param_np] [#param_n_comp]

	o<#self_id_act> endif

	(end #sub_name)
