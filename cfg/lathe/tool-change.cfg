[SUBROUTINE]
version = 1.19
icon = lathe-tool-change.png
name = _("Tool Change")
type = tool_change
help = _("<b>Change Tool and/or settings</b>&#10;Changes setting accordingly even if disabled")
order = act h1 dnum us tlc spindle_dir cooling h2 mode speed surf_speed feed_mode path_mode path_tol path_q h8 r_feed c_dpt h4 f_feed fc_dpt hc rx rix rz h_tgeo tdia torient

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1
tool_tip = _("Params will be set even if disabled")

[PARAM_H1]
name = _("Tool and usage")
type = sub-header

[PARAM_DNUM]
name = _("Tool number")
header = h1
type = tool
icon = lathe-tool.png
tool_tip = _("Select from tool table")
value = 0
value_changed =
	TOOL_TABLE.save_tool_orient(int(new_val))
	parent.get_param('param_h_tgeo').attr['name'] = _("'Tool geometry - nose R %.3f, orient %d, width %.3f'") % (TOOL_TABLE.get_tool_nose_radius(int(new_val)), TOOL_TABLE.get_tool_orient(), TOOL_TABLE.get_tool_width(int(new_val)))

[PARAM_US]
name = _("Usage")
header = h1
type = combo
options = _("Roughing and finishing=0:Roughing=1:Finishing=2")
tool_tip = _("Select usage for this tool")
value = 0
icon = tool-usage.png

[PARAM_TLC]
name = _("Use length comp")
icon = comp-l.png
type = combo
options = _("No=0:Already mounted and touched=3:From tool table=1:Table and probe=2")
header = h1
value = 1
tool_tip = _("Use G43 and probe if setup")

[PARAM_COOLING]
name = _("Use cooling")
header = h1
type = combo
options = _("None=9:Flood=8:Mist=7")
icon = snowflake.png
tool_tip = _("Use flood, mist or none")
value = 8

[PARAM_SPINDLE_DIR]
name = _("Start spindle")
header = h1
type = combo
options = _("No=5:Clockwise=3:Counter-clockwise=4")
icon = lathe-dir.png
tool_tip = _("Select spindle rotation")
value = 3

[PARAM_H2]
name = _("Spindle control")
type = sub-header

[PARAM_MODE]
name = _("Mode")
icon = lathe-chuck.png
type = combo
header = h2
options = _("Constant surface speed=0:RPM=1")
value = 1
value_changed = 
	parent.get_param('param_surf_speed').set_grayed(new_val == '1')
	if new_val == '1' :
		parent.get_param('param_speed').attr['name'] = _("'Spindle speed'")
	else :
		parent.get_param('param_speed').attr['name'] = _("'Max spindle'")

[PARAM_SPEED]
name = _("Max spindle")
header = h2
type = int
minimum_value = 10
icon = tool-spindle.png
tool_tip = _("RPM spindle speed")
value = 500

[PARAM_SURF_SPEED]
name = _("Surface speed")
header = h2
type = int
minimum_value = 1
icon = tool-spindle.png
tool_tip = _("Constant spindle speed")
value = 100
grayed = 0

[PARAM_FEED_MODE]
name = _("Feed mode")
icon = lathe-feed.png
type = combo
header = h2
options = _("Per minute (G94)=94:Per revolution (G95)=95")
value = 95
tool_tip = _("How the F feed rate is interpreted for every operation after this tool change. Lathe work normally uses per-revolution (G95).")

[PARAM_PATH_MODE]
name = _("Path blending")
icon = rad-arc-opt.png
type = combo
header = h2
options = _("Blending with tolerance (G64 P)=0:Blending, best speed (G64)=1:Exact path (G61)=2:Exact stop (G61.1)=3")
value = 0
value_changed =
	parent.get_param('param_path_tol').set_grayed(new_val != '0')
	parent.get_param('param_path_q').set_grayed(new_val != '0')
tool_tip = _("How LinuxCNC follows the programmed path from this tool change on. Blending with tolerance is the usual choice and what NativeCAM used to hard-code. Exact path slows to a stop at corners it cannot round within tolerance; exact stop stops at every one.")

[PARAM_PATH_TOL]
name = _("Blend tolerance (P)")
header = h2
type = float
icon = line-len.png
value = 0.001
metric_value = 0.025
minimum_value = 0.0
tool_tip = _("G64 P value - how far the actual path may deviate from the programmed one when rounding a corner. Larger runs faster and rounds more; 0 emits a plain G64.")

[PARAM_PATH_Q]
name = _("Naive CAM tolerance (Q)")
header = h2
type = float
icon = line-len.png
value = 0.0
metric_value = 0.0
minimum_value = 0.0
tool_tip = _("G64 Q value - collinear moves within this tolerance are merged into one. Only useful for finely segmented paths. 0 leaves Q off the line, and LinuxCNC then reuses the P value for it.")

[PARAM_H8]
name = _("Roughing")
type = sub-header
tool_tip = _("Set these when usage is roughing")

[PARAM_R_FEED]
name = _("Feed")
header = h8
type = float
icon = lathe-feed.png
tool_tip = _("Feed at 100% engagement")
minimum_value = 0.0
not_allowed = 0
value = 3.0
metric_value = 75.0

[PARAM_C_DPT]
name = _("Cut depth")
type = float
minimum_value = 0.0
tool_tip = _("Depth of cutter engagment in machine units per pass")
value = 0.02
header = h8
metric_value = 0.5
not_allowed = 0
icon = lathe-depth-step.png

[PARAM_H4]
name = _("Finishing")
type = sub-header
tool_tip = _("Set these when usage include finishing")

[PARAM_F_FEED]
name = _("Feed")
header = h4
type = float
icon = lathe-feed.png
tool_tip = _("Feed at 100% engagement")
minimum_value = 0.0
not_allowed = 0
value = 2.0
metric_value = 50.0

[PARAM_FC_DPT]
name = _("Cut depth")
type = float
minimum_value = 0.0
tool_tip = _("Depth of cutter engagment in machine units per pass")
value = 0.01
header = h4
metric_value = 0.25
not_allowed = 0
icon = lathe-depth-step.png

[PARAM_HC]
name = _("Clearances")
type = sub-header

[PARAM_RX]
name = _("Retract X")
type = float
value = 0.04
metric_value = 1.0
minimum_value = 0.0
not_allowed = 0
header = hc
icon = lx-clear.png
tool_tip = _("Retract distance on multiple passes")

[PARAM_RIX]
name = _("Int. retract X")
type = float
value = 0.040
metric_value = 1.0
minimum_value = 0.0
not_allowed = 0
tool_tip = _("Retract distance")
header = hc
icon = ix-clear.png

[PARAM_RZ]
name = _("Retract Z")
type = float
value = 0.04
metric_value = 1.0
minimum_value = 0.0
not_allowed = 0
header = hc
icon = lz-clear.png
tool_tip = _("Retract distance on multiple passes")

[PARAM_H_TGEO]
name = _("Tool geometry")
type = sub-header
tool_tip = _("Nose radius, orientation and grooving width of the loaded tool, read from the tool table. Width has no tool-table column, so it is read from a W token in the tool description - a row ending in ;groove W3.0 gives a 3 mm insert. Width 0 means no token was found. Defaults below fill in when the table has no nose data.")

[PARAM_TDIA]
name = _("Default nose dia")
header = h_tgeo
type = float
minimum_value = 0.0
not_allowed = 0
value = 0.0
icon = corner-radius.png
tool_tip = _("Nose diameter used by tool-nose compensation when the loaded tool has no D in the tool table. 0 = use the tool table only.")

[PARAM_TORIENT]
name = _("Default orient")
header = h_tgeo
type = combo
options = _("From table=0:1=back:2=front:3:4:5:6=neutral X-:7:8:9=on centre")
value = 0
icon = corner-radius.png
tool_tip = _("Tool orientation (Q) used by tool-nose compensation when the loaded tool has no Q in the tool table. 'From table' = use the tool table only.")

[DEFINITIONS]
content =
;	<eval>self.include_once(file name here)</eval>

[INIT]
content =
	a = parent.get_param('param_mode').get_attr('value')
	parent.get_param('param_surf_speed').set_grayed(a == '1')
	if a == '1' :
		parent.get_param('param_speed').attr['name'] = _("'Spindle speed'")
	else :
		parent.get_param('param_speed').attr['name'] = _("'Max spindle'")
	b = parent.get_param('param_path_mode').get_attr('value')
	parent.get_param('param_path_tol').set_grayed(b != '0')
	parent.get_param('param_path_q').set_grayed(b != '0')
	tn = int(parent.get_param('param_dnum').get_attr('value') or 0)
	TOOL_TABLE.save_tool_orient(tn)
	parent.get_param('param_h_tgeo').attr['name'] = _("'Tool geometry - nose R %.3f, orient %d, width %.3f'") % (TOOL_TABLE.get_tool_nose_radius(tn), TOOL_TABLE.get_tool_orient(), TOOL_TABLE.get_tool_width(tn))

[VALIDATION]
content =
	TOOL_TABLE.save_tool_orient(#param_dnum)

[CALL]
content =
	(begin #sub_name)
	(author : Fernand Veilleux)
	
	o<#self_id_tlc> if [[#param_tlc EQ 3] AND [#param_dnum GT 0]]
		M61 Q#param_dnum
	o<#self_id_tlc> endif
	
	o<#self_id_act> if [#param_act AND [#param_dnum NE #5400]]    
		M9  (coolant off)
		T#param_dnum M6
	o<#self_id_act> endif
	
	o<#self_id_lc> if [#param_tlc GE 1]
		G43 H#param_dnum
	o<#self_id_lc> endif

	#<_tool_usage>   =  #param_us
	#<_spindle_dir>  =  #param_spindle_dir
	#<_cooling_mode> =  #param_cooling
	
	#<_rough_feed>   =  #param_r_feed
	#<_rough_cut>    =  #param_c_dpt
	#<_feed_normal>  =  #param_r_feed
	
	#<_finish_feed>  =  #param_f_feed
	#<_finish_cut>   =  #param_fc_dpt
	
	#<_rpm_normal>   =  #param_speed
	
	#<_feedfactor0>  =  1.0
	#<_feedfactor1>  =  1.0
	#<_feedfactor2>  =  1.0
	#<_feedfactor3>  =  1.0
	#<_feedfactor4>  =  1.0
	
	#<_speedfactor0> =  1.0
	#<_speedfactor1> =  1.0
	#<_speedfactor2> =  1.0
	#<_speedfactor3> =  1.0
	#<_speedfactor4> =  1.0
	
	#<_tool_eng1>    =  1.0
	#<_tool_eng2>    =  1.0
	#<_tool_eng3>    =  1.0
	
	o<#self_id1> if [#param_mode EQ 0]
		G96 D#param_speed S#param_surf_speed
	o<#self_id1> else
		G97 S#param_speed
	o<#self_id1> endif

	G#param_feed_mode (feed per minute G94 / per revolution G95)

	(path control: was hard-coded in the file header, now chosen per tool change)
	o<#self_id_pm> if [[#param_path_mode EQ 0] AND [#param_path_tol GT 0]]
		o<#self_id_pq> if [#param_path_q GT 0]
			G64 P#param_path_tol Q#param_path_q
		o<#self_id_pq> else
			G64 P#param_path_tol
		o<#self_id_pq> endif
	o<#self_id_pm> elseif [#param_path_mode LE 1]
		(plain blending - also where a 0 tolerance lands, since G64 P0 is not it)
		G64
	o<#self_id_pm> elseif [#param_path_mode EQ 2]
		G61
	o<#self_id_pm> else
		G61.1
	o<#self_id_pm> endif

	o<#self_id2> if [#<_spindle_dir> GT 0]
		M#<_spindle_dir>
		G4 P#<_spindle_speed_up_delay>
	o<#self_id2> endif
	
	#<_z_clear>  = [[#5410 * #<_tbl_scale>] + #param_rz]
	#<_x_clear>  = [[[#5410 * #<_tbl_scale>] + #param_rx] * #<_diameter_mode>]
	#<_ix_clear> = [#param_rix * #<_diameter_mode>]

	(tool-nose-comp defaults: only override the machine globals when the tool)
	(table lacks the data - a 0 here leaves the existing default untouched)
	o<#self_id_tgd> if [#param_tdia GT 0]
		#<_tip_nose_dia> = #param_tdia
	o<#self_id_tgd> endif
	o<#self_id_tgo> if [#param_torient GT 0]
		#<_tip_orient> = #param_torient
	o<#self_id_tgo> endif

	F#<_rough_feed>

	(end #sub_name)

