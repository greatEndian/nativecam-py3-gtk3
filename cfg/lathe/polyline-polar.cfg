[SUBROUTINE]
version = 1.17
icon = line-polar.png
name = _("Line Polar")
type = poly-line-polar
help = _("<b>Trace a line to a polar position</b>&#10;Length and angle, each measured from a reference you choose")
order = act h1 type l a a_ref

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
type = sub-header
name = _("Definition")

[PARAM_TYPE]
name = _("Position from")
header = h1
type = combo
options = _("Previous point=2:Origin - global absolute=1")
icon = line-rel.png
tool_tip = _("Where the Length is measured from. Previous point: the segment steps this far from the end of the previous one, in the direction the Angle gives. Origin: the Length and Angle are the polar coordinates of the point itself, measured from the workpiece coordinate origin, so it stays put when an earlier segment changes - and the Angle stops being a direction, which is why Angle from is disabled there.")
value = 2
value_changed =
	parent.get_param('param_a_ref').set_grayed(new_val == '1')
	if new_val == '1' :
		parent.get_param('param_a').attr['name'] = _("'Angle from origin'")
		parent.get_param('param_l').attr['name'] = _("'Distance from origin'")
	else :
		parent.get_param('param_a').attr['name'] = _("'Angle'")
		parent.get_param('param_l').attr['name'] = _("'Length'")

[PARAM_L]
name = _("Length")
header = h1
type = float
icon = line-len.png
tool_tip = _("Distance in the Z/radius plane - a radius, not a diameter. Negative runs the same angle backwards, the same line as adding 180 to the angle. 0 is not a line.")
value = 1
metric_value = 25
not_allowed = 0

[PARAM_A]
name = _("Angle")
header = h1
type = float
icon = angle.png
digits = 2
tool_tip = _("Angle measured from whatever Angle from selects. 0 is along that reference direction.")
value = 45
suffix = &#176;

[PARAM_A_REF]
name = _("Angle from")
header = h1
type = combo
options = _("Z+ axis - absolute=0:Previous line or chord=1:Previous arc centre=2")
icon = line-rel.png
tool_tip = _("What the Angle is measured from. Z+ axis: an absolute direction, unaffected by the segment before it. The two relative choices turn the angle by the previous line/chord's own direction, or by the previous arc's centre direction, so the segment follows when that neighbour changes. Ignored - and disabled - when Position from is Origin, where the Angle is a coordinate rather than a direction.")
value = 0

[DEFINITIONS]
content =
;	<eval>self.include_once(file name here)</eval>

[INIT]
content =
	t = int(float(parent.get_param('param_type').get_attr('value') or 2))
	if t == 3 or t == 30 :
		parent.get_param('param_a_ref').set_value('1' if t == 3 else '2', parent)
		parent.get_param('param_type').set_value('2', parent)
		t = 2
	parent.get_param('param_a_ref').set_grayed(t == 1)
	if t == 1 :
		parent.get_param('param_a').attr['name'] = _("'Angle from origin'")
		parent.get_param('param_l').attr['name'] = _("'Distance from origin'")
	else :
		parent.get_param('param_a').attr['name'] = _("'Angle'")
		parent.get_param('param_l').attr['name'] = _("'Length'")

[CALL]
content =
	(begin #sub_name)

	o<#self_id_active> if [#param_act AND #<in_polyline>]
		(position and angle references are chosen independently in the tree;)
		(poly_add_item encodes the pair as one item type - 1 absolute point,)
		(2 step at an absolute angle, 3 step turned by the previous line,)
		(30 step turned by the previous arc centre)
		o<#self_id_pick> if [#param_type EQ 1]
			#<polar_type> = 1
		o<#self_id_pick> elseif [#param_a_ref EQ 1]
			#<polar_type> = 3
		o<#self_id_pick> elseif [#param_a_ref EQ 2]
			#<polar_type> = 30
		o<#self_id_pick> else
			#<polar_type> = 2
		o<#self_id_pick> endif

		o<poly_add_item> CALL [#<polar_type>] [#param_l * COS[#param_a]] [#param_l * SIN[#param_a]] [1] [0] [0] [0] [1] [0] [0] [0]

	o<#self_id_active> endif
	(end #sub_name)
