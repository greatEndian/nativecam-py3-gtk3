[SUBROUTINE]
version = 1.16
icon = line-polar.png
name = _("Line Polar")
type = poly-line-polar
help = _("<b>Trace a line to a polar position</b>&#10;Length and angle, measured from the previous point, from the previous direction, or from the workpiece origin")
order = act h1 a type l

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
type = sub-header
name = _("Definition")

[PARAM_L]
name = _("Length")
header = h1
type = float
icon = line-len.png
tool_tip = _("Distance in the Z/radius plane - a radius, not a diameter. Negative runs the same angle backwards, the same line as adding 180 to the angle. 0 is not a line.")
value = 1
metric_value = 25
not_allowed = 0

[PARAM_A]
name = _("Angle")
header = h1
type = float
icon = angle.png
digits = 2
tool_tip = _("Angle relative to Z axis (0deg is along Z+)")
value = 45
suffix = &#176;

[PARAM_TYPE]
name = _("Position option")
header = h1
type = combo
options = _("Absolute=2:Global absolute=1:Relative to previous line or chord=3:Relative to previous arc center=30")
icon = line-rel.png
tool_tip = _("What the Length and Angle are measured from. Absolute: the angle is measured from Z+, but the length still steps from the end of the previous segment. Global absolute: the pair is the point itself, measured from the workpiece coordinate origin, so it does not move when an earlier segment changes. The two relative options measure the angle from the previous line/chord, or from the previous arc centre.")
value = 2

[CALL]
content =
	(begin #sub_name)
	
	o<#self_id_active> if [#param_act AND #<in_polyline>]
		o<poly_add_item> CALL [#param_type] [#param_l * COS[#param_a]] [#param_l * SIN[#param_a]] [1] [0] [0] [0] [1] [0] [0] [0]
		
	o<#self_id_active> endif
	(end #sub_name)
