[SUBROUTINE]
version = 1.16
icon = line-to.png
name = _("Line To")
type = poly-line-to
help = _("<b>Create a line to X, Z</b>&#10;Absolute or Relative, with optional rounded or chamfered merge into the previous segment")
order = act h1 type x z h2 m_style m_r m_b m_flip

[PARAM_ACT]
name = _("Active")
icon = enable.png
type = bool
value = 1

[PARAM_H1]
name = _("Coords")
type = sub-header

[PARAM_X]
name = _("X (Diameter)")
header = h1
type = float
icon = x.png
tool_tip = _("Destination X")
value = 1
metric_value = 25

[PARAM_Z]
name = _("Z")
header = h1
type = float
icon = z.png
tool_tip = _("Destination Z")
value = -1
metric_value = -25

[PARAM_H2]
name = _("Merge with previous")
type = sub-header

[PARAM_M_STYLE]
name = _("Style")
header = h2
type = combo
options = _("None=0:Radius=1:Chamfer=2:Chamfer two lengths=21:Chamfer length + angle=22")
icon = corner-style.png
tool_tip = _("Transition into the previous segment. Ignored on the first segment. Chamfers need straight segments on both sides.")
value = 0

[PARAM_M_R]
name = _("Radius / Length")
header = h2
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Radius, common chamfer length, or first chamfer length (on the previous segment). 0 disables the merge.")
value = 0.0
metric_value = 0.0

[PARAM_M_B]
name = _("Length 2 / Angle")
header = h2
type = float
minimum_value = 0.0
icon = corner-radius.png
tool_tip = _("Second chamfer length (on this segment) or chamfer angle in degrees, per the selected style.")
value = 0.0
metric_value = 0.0

[PARAM_M_FLIP]
name = _("Flip")
header = h2
type = bool
icon = flip.png
tool_tip = _("Swap which segment gets which length, or measure the angle from the other segment.")
value = 0

[PARAM_TYPE]
name = _("Option")
header = h1
type = combo
options = _("Relative=0:Absolute=1:Z relative, X absolute=10:Z absolute, X relative=11")
icon = line-rel.png
tool_tip = _("Select Relative or Absolute")
value = 0

[CALL]
content =
        (begin #sub_name)
        o<#self_id_active> if [#param_act AND #<in_polyline>]
                (Map Lathe Z -> Mill X, Lathe X -> Mill Y)
                #<z_val> = [#param_z]
                #<x_val> = [#param_x / #<_diameter_mode>]
                (merge style: 1 = radius via poly_link, 2/21/22 = chamfer variants in poly_add_item)
                #<cs_val> = [#param_m_style * [#param_m_r GT 0]]

                o<#self_id_type> if [#param_type EQ 10]
                   (Z relative, X absolute)
                   o<poly_add_item> CALL [10] [#<z_val>] [#<x_val>] [1] [#<cs_val>] [#param_m_r] [#param_m_flip] [1] [#param_m_b] [0] [0]
                o<#self_id_type> elseif [#param_type EQ 11]
                   (Z absolute, X relative)
                   o<poly_add_item> CALL [11] [#<z_val>] [#<x_val>] [1] [#<cs_val>] [#param_m_r] [#param_m_flip] [1] [#param_m_b] [0] [0]
                o<#self_id_type> else
                   o<poly_add_item> CALL [#param_type] [#<z_val>] [#<x_val>] [1] [#<cs_val>] [#param_m_r] [#param_m_flip] [1] [#param_m_b] [0] [0]
                o<#self_id_type> endif

        o<#self_id_active> endif
        (end #sub_name)
